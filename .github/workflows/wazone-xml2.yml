name: Wazone Auto-Relay Harvester V4

on:
  workflow_dispatch:
    inputs:
      skip_to:
        description: '起始索引 (本轮从第几个资源开始)'
        required: true
        default: '0'
      workers:
        description: '并发线程数 (推荐 15-40)'
        required: true
        default: '40'

jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Tactical Space Expansion (极限清理)
        run: |
          echo "=== 初始空间 ==="
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          echo "=== 清理后空间 ==="
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python_version: '3.10'

      - name: Install Dependencies
        run: pip install requests lxml

      - name: Execute Precision Harvest
        id: run_script
        run: |
          # 确保 Python 脚本中的熔断值已改为 30GB 以适配 V4
          python download.py --skip ${{ github.event.inputs.skip_to }} --workers ${{ github.event.inputs.workers }} --xml_dir ./lists
          
      - name: Archive and Compress (分卷归档)
        if: always()
        run: |
          if [ -d "./harvest_zone" ] && [ "$(ls -A ./harvest_zone)" ]; then
            7z a -v1900m -mx0 "wazone_v4_idx_${{ github.event.inputs.skip_to }}.7z" ./harvest_zone/*
            rm -rf ./harvest_zone
          else
            echo "⚠️ 本轮未捕获到新资产。"
          fi

      - name: Upload to Vault V4 (资产与报告)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: "wazone-vault-v6"
          name: "Wazone 资源总库 V4"
          # 【精准修正】重命名语法为 path:new_name，每行处理一个文件
          files: |
            wazone_v4_idx_${{ github.event.inputs.skip_to }}.7z.*
            failed_report.txt:failed_report_${{ github.event.inputs.skip_to }}.txt
            next_skip.txt:next_skip_${{ github.event.inputs.skip_to }}.txt
            next_skip.txt
          append_body: true
          body: |
            ---
            ### 📥 自动报告 (起始点: ${{ github.event.inputs.skip_to }})
            - **并发线程**: ${{ github.event.inputs.workers }}
            - **状态**: 阶段性任务完成
            - **后续接力**: 详见附件 next_skip_${{ github.event.inputs.skip_to }}.txt

      - name: Self-Triggering Relay (自动化接力)
        if: success() 
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f next_skip.txt ]; then
            NEXT_INDEX=$(cat next_skip.txt)
            if [ "$NEXT_INDEX" -le "${{ github.event.inputs.skip_to }}" ]; then
                echo "🛑 进度停滞，接力终止。"
                exit 1
            fi

            if [ "$NEXT_INDEX" -lt 128307 ]; then
              echo "🚀 接力信号：$NEXT_INDEX。正在启动下一轮任务..."
              # 确保这里的文件名和您在仓库里的 yml 文件名一致
              gh workflow run wazone-xml2.yml -f skip_to=$NEXT_INDEX -f workers=${{ github.event.inputs.workers }}
            else
              echo "🎉 所有已完成！"
            fi
          else
            echo "❌ 未发现接力索引文件，链条断裂。"
            exit 1
          fi
